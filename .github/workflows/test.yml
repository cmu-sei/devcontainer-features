name: Test features
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/validate.py
      # features publish does not check metadata against the schema; devcontainers/action did.
      - name: Validate feature metadata against the Dev Container Feature schema
        run: |
          curl -fsSL -o "$RUNNER_TEMP/feature.schema.json" \
            https://raw.githubusercontent.com/devcontainers/spec/1b2baddb5f1071ca0e8bcb7eb56dbc9d3e4a674f/schemas/devContainerFeature.schema.json
          npx -y ajv-cli@5.0.0 validate --spec=draft7 --strict=false \
            -s "$RUNNER_TEMP/feature.schema.json" -d 'src/*/devcontainer-feature.json'
      - name: Test installed lifecycle scripts without workspace feature sources
        run: docker run --rm -v "$PWD:/repo:ro" mcr.microsoft.com/devcontainers/python:3.14-trixie bash /repo/tools/runtime-tests/runtime.sh
  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a metadata version bump for every changed feature package
        run: |
          base="origin/${{ github.base_ref }}"
          status=0
          for dir in $(git diff --name-only "$base"...HEAD -- src | cut -d/ -f1-2 | sort -u); do
            [ -f "$dir/devcontainer-feature.json" ] || continue
            old=$(git show "$base:$dir/devcontainer-feature.json" 2>/dev/null | jq -r .version || true)
            new=$(jq -r .version "$dir/devcontainer-feature.json")
            if [ "$old" = "$new" ]; then
              echo "::error::$dir changed but its version is still $new; published versions are never rebuilt."
              status=1
            fi
          done
          exit "$status"
  feature:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [aws-session-manager-plugin, bedrock, chat, claude, codex, grok, herdr, oh-my-logo, opencode, pi, playwright, pure-prompt, sei-certs, shell-completions, shell-history, tmux]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install -g @devcontainers/cli@0.87.0
      # A feature that needs other features to install (playwright needs node) is tested by its
      # scenarios.json, which can add them; the autogenerated test installs the feature alone.
      - name: Build and exercise feature on the organizational Python base
        run: |
          if [ -f 'test/${{ matrix.feature }}/scenarios.json' ]; then mode=--skip-autogenerated; else mode=--skip-scenarios; fi
          devcontainer features test "$mode" --remote-user vscode -f '${{ matrix.feature }}' -i mcr.microsoft.com/devcontainers/python:3.14-trixie .
